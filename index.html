<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vorschau für Therapieteam Rheine</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 24px;
            color: #0077b6;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        /* Der stylische Button */
        .chat-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #0077b6;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 119, 182, 0.3);
        }

        .chat-button:hover {
            background-color: #005f8d;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ihr Praxisassistent ist einsatzbereit!</h1>

        <p>
            Hallo Therapieteam Rheine,<br><br>
            Da die direkte Einbettung zur Vorschau aktuell aufgrund einer technischen Störung nicht möglich ist, 
            haben wir einen direkten Zugang für Sie eingerichtet.
        </p>

        <!-- ERSETZE DEN LINK UNTEN durch deinen "Shareable Link" aus Botpress -->
        <a href="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/09/03/18/20260903184840-R23THDBY.json" class="chat-button">
            Hier anschauen →
        </a>
    </div>

</body>
</html>
