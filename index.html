<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolte KG – Digitaler Assistent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 640px;
            padding: 50px 40px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .logo {
            margin-bottom: 35px;
        }

        .logo img {
            max-width: 100%;
            height: auto;
            width: 150px;
        }

        h1 {
            font-size: 27px;
            color: #064b9b;
            margin: 0 0 18px;
            font-weight: 700;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #666;
            margin: 0;
        }

        .hint {
            margin-top: 28px;
            font-size: 15px;
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            .logo img {
                width: 130px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="logo.png" alt="Bolte Logo">
        </div>

        <h1>
            Ihr digitaler Assistent ist einsatzbereit!
        </h1>

        <p>
            Hier können Sie direkt ausprobieren, wie ein
            digitaler Assistent auf Ihrer Website eingesetzt
            werden könnte.
        </p>

        <div class="hint">
            Klicken Sie dazu einfach unten rechts auf den Chat.
        </div>

    </div>


    <!-- BOTPRESS – NICHT VERÄNDERN -->
    <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/09/05/15/20260905155333-5XQWS5QC.js" defer></script>

</body>
</html>
